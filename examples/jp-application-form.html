<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>会員登録のお申し込み（架空）</title><style>body{font:15px/1.7 system-ui,sans-serif;max-width:720px;margin:32px auto;padding:0 20px;color:#1f2d33}fieldset{border:1px solid #d5dee2;border-radius:8px;margin:14px 0;padding:8px 14px}legend{font-weight:600}label{display:inline-block;margin:6px 12px 6px 0}input:not([type=checkbox]):not([type=radio]),select,textarea{padding:6px;border:1px solid #b9c7cd;border-radius:6px;font:inherit}textarea{width:100%;box-sizing:border-box}small{color:#62757d}</style></head><body><h1>会員登録のお申し込み（架空のフォーム）</h1><p><small>練習用の架空フォームです。送信ボタンは動作しません。</small></p>
<form>
<fieldset><legend>お名前</legend><label>姓 <input name="sei" size="10"></label><label>名 <input name="mei" size="10"></label></fieldset>
<fieldset><legend>フリガナ（全角カタカナ）</legend><label>セイ <input name="sei_kana" size="10"></label><label>メイ <input name="mei_kana" size="10"></label></fieldset>
<label>ふりがな（ひらがな・姓名の間は空白） <input name="furigana" size="24"></label>
<fieldset><legend>郵便番号（半角数字）</legend>〒 <input name="zip1" size="3" maxlength="3" aria-label="郵便番号 前半3桁"> - <input name="zip2" size="4" maxlength="4" aria-label="郵便番号 後半4桁"></fieldset>
<fieldset><legend>ご住所</legend><label>都道府県 <select name="pref"><option value="">選択してください</option><option>北海道</option><option>東京都</option><option>神奈川県</option><option>大阪府</option><option>福岡県</option></select></label><br><label>市区町村 <input name="city" size="16"></label><label>町名・番地 <input name="street" size="20"></label><br><label>建物名・部屋番号 <input name="building" size="24"></label></fieldset>
<fieldset><legend>生年月日</legend><select name="birth_year" aria-label="生年月日 年（西暦）"><option value="">----</option><option value="2010">2010</option><option value="2009">2009</option><option value="2008">2008</option><option value="2007">2007</option><option value="2006">2006</option><option value="2005">2005</option><option value="2004">2004</option><option value="2003">2003</option><option value="2002">2002</option><option value="2001">2001</option><option value="2000">2000</option><option value="1999">1999</option><option value="1998">1998</option><option value="1997">1997</option><option value="1996">1996</option><option value="1995">1995</option><option value="1994">1994</option><option value="1993">1993</option><option value="1992">1992</option><option value="1991">1991</option><option value="1990">1990</option><option value="1989">1989</option><option value="1988">1988</option><option value="1987">1987</option><option value="1986">1986</option><option value="1985">1985</option><option value="1984">1984</option><option value="1983">1983</option><option value="1982">1982</option><option value="1981">1981</option><option value="1980">1980</option><option value="1979">1979</option><option value="1978">1978</option><option value="1977">1977</option><option value="1976">1976</option><option value="1975">1975</option><option value="1974">1974</option><option value="1973">1973</option><option value="1972">1972</option><option value="1971">1971</option><option value="1970">1970</option><option value="1969">1969</option><option value="1968">1968</option><option value="1967">1967</option><option value="1966">1966</option><option value="1965">1965</option><option value="1964">1964</option><option value="1963">1963</option><option value="1962">1962</option><option value="1961">1961</option><option value="1960">1960</option><option value="1959">1959</option><option value="1958">1958</option><option value="1957">1957</option><option value="1956">1956</option><option value="1955">1955</option><option value="1954">1954</option><option value="1953">1953</option><option value="1952">1952</option><option value="1951">1951</option><option value="1950">1950</option><option value="1949">1949</option><option value="1948">1948</option><option value="1947">1947</option><option value="1946">1946</option><option value="1945">1945</option><option value="1944">1944</option><option value="1943">1943</option><option value="1942">1942</option><option value="1941">1941</option><option value="1940">1940</option></select> 年 <select name="birth_month" aria-label="生年月日 月"><option value="">--</option><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option><option value="6">6</option><option value="7">7</option><option value="8">8</option><option value="9">9</option><option value="10">10</option><option value="11">11</option><option value="12">12</option></select> 月 <select name="birth_day" aria-label="生年月日 日"><option value="">--</option><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option><option value="6">6</option><option value="7">7</option><option value="8">8</option><option value="9">9</option><option value="10">10</option><option value="11">11</option><option value="12">12</option><option value="13">13</option><option value="14">14</option><option value="15">15</option><option value="16">16</option><option value="17">17</option><option value="18">18</option><option value="19">19</option><option value="20">20</option><option value="21">21</option><option value="22">22</option><option value="23">23</option><option value="24">24</option><option value="25">25</option><option value="26">26</option><option value="27">27</option><option value="28">28</option><option value="29">29</option><option value="30">30</option><option value="31">31</option></select> 日</fieldset>
<fieldset><legend>電話番号（半角数字）</legend><input name="tel1" size="5" maxlength="5" aria-label="電話番号 市外局番"> - <input name="tel2" size="4" maxlength="4" aria-label="電話番号 市内局番"> - <input name="tel3" size="4" maxlength="4" aria-label="電話番号 加入者番号"></fieldset>
<fieldset><legend>性別</legend><label><input type="radio" name="gender" value="male">男性</label><label><input type="radio" name="gender" value="female">女性</label><label><input type="radio" name="gender" value="none" checked>回答しない</label></fieldset>
<fieldset><legend>ご希望の連絡方法</legend><label><input type="radio" name="contact" value="email">メール</label><label><input type="radio" name="contact" value="phone">電話</label><label><input type="radio" name="contact" value="post">郵送</label></fieldset>
<label>メールアドレス（半角英数字） <input type="email" name="email" size="30"></label><br>
<label>勤務先（全角） <input name="company" size="24"></label>
<label>備考 <textarea name="note" rows="3"></textarea></label>
<label><input type="checkbox" name="agree"> 個人情報の取り扱いに同意する</label><br>
<button type="button">確認画面へ（動作しません）</button>
</form></body></html>
